mockHass.callApi=async(method,path,data)=>{
  if(path==='events/heating_plan_history'){
    comparisonRequests.push(data);const old=mockHass.states['sensor.heating_plan_history'];

  }
  systemRequests.push({method,path,data});if(window.failSystem)throw new Error('Немає доступу');

  const old=mockHass.states['sensor.heating_system_settings'];
  mockHass.states={...mockHass.states,'sensor.heating_system_settings':{...old,attributes:{...old.attributes,

    fields:old.attributes.fields.map(f=>({...f,value:Object.hasOwn(data.values,f.key)?data.values[f.key]:f.value}))}}};
  panel.hass={...mockHass};
};
window.historyRequests=[];
mockHass.callWS=async request=>{
  historyRequests.push(request);
  if(window.failHistory)throw new Error('Recorder unavailable');
  if(window.emptyHistory)return {};
  const start=Date.parse(request.start_time)/1000,end=Date.parse(request.end_time)/1000,span=end-start;
  const measured=(s,fraction)=>({s:String(s),lu:start+fraction*span});
  return {

// Canvas fixture exercises intrinsic sizing, DPR, lifecycle and ResizeObserver.
// These are synthetic chart data, not a replacement for HA Recorder testing.
class FixtureChart extends HTMLElement {
  constructor(){super();this.attachShadow({mode:'open'});this.shadowRoot.innerHTML='<style>:host{color:#97aaa0}small{display:block;padding:10px 0;font:11px system-ui}canvas{display:block;width:100%;height:200px}</style><small>Тестові дані · попередній перегляд</small><canvas width="900" height="200"></canvas>';}
  connectedCallback(){this.observer=new ResizeObserver(()=>this.draw());this.observer.observe(this);this.draw();}
  disconnectedCallback(){this.observer?.disconnect();}
  draw(){const canvas=this.shadowRoot.querySelector('canvas'),w=this.getBoundingClientRect().width||300,dpr=devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=200*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.strokeStyle='#8883';for(let y=20;y<180;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}c.strokeStyle=getComputedStyle(this).getPropertyValue('--primary-color').trim()||'#69d5b2';c.lineWidth=2;c.beginPath();for(let x=0;x<=w;x+=3){const y=110-Math.sin(x/w*6)*45;x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
}
customElements.define('fixture-native-chart',FixtureChart);
