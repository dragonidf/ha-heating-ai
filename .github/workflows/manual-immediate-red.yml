name: Build and verify final 0.5.14 candidate
on:
  push:
    branches: [fix/manual-immediate-start]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: PYTHONPATH=apps/heating_ai:tests python -m unittest test_manual_energy_session test_fallback_recovery.FinalDispatchGuardTests -v
      - run: python tools/build_ui.py
      - run: PYTHONPATH=apps/heating_ai:tests python -m unittest test_native_v1_production.ProductionTests.test_immediate_manual_request_cannot_bypass_native_voltage_or_kws test_native_v1_production.ProductionTests.test_native_manual_progress_uses_measured_phase_power_with_unchanged_counter -v
      - run: node --test --test-name-pattern='manual' tests/frontend.test.mjs
      - name: Commit generated candidate assets only
        run: |
          git add frontend/heating-panel.js apps/heating_ai/heating_ui_assets.py apps/heating_ai/release.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync live KWS progress assets'
            git push origin HEAD:fix/manual-immediate-start
          fi
      - run: make check test
