name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make check test
      - name: Browser dependencies
        if: matrix.python == '3.12'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Browser interaction and responsive layout
        if: matrix.python == '3.12'
        run: |
          python tools/check_ui_browser.py
          python tools/check_ui_browser.py --browser webkit
