name: Heating AI V1 native candidate (NOT a release)
on:
  pull_request:
    paths:
      - 'custom_components/**'
      - 'tools/build_marketplace.py'
      - 'tests/test_marketplace_package.py'
      - 'hacs.json'
      - 'manifest.json'
      - '.github/workflows/marketplace-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify the existing nine V1 module fingerprints
        run: python tools/build_ui.py --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Read-only native panel ES module syntax
        run: node --input-type=module --check < custom_components/heating_ai_legacy/assets/panel.js
      - name: Reproducible native-engine and package tests
        run: PYTHONPATH=apps/heating_ai python -m unittest discover -s tests -p test_marketplace_package.py -v
      - name: Independent V1 24-hour optimizer fail-closed tests
        run: python -m unittest discover -s tests -p test_native_v1_planner.py -v
      - name: Native V1 safety, KWS, durable state and checksum tests
        run: python -m unittest discover -s tests -p test_native_v1_safety.py -v
      - name: V1 data migration dry-run and SHA-256 source preservation
        run: python -m unittest discover -s tests -p test_native_v1_migration.py -v
      - name: Legacy V1 decision parity and manual AUTO priority
        run: python -m unittest discover -s tests -p test_native_v1_intent.py -v
      - name: Calendar 3.1 native outage events are partial evidence
        run: python -m unittest discover -s tests -p test_native_v1_calendar.py -v
      - name: Independent V1 floor observer parity and private checkpoint
        run: python -m unittest discover -s tests -p test_native_v1_floor.py -v
      - name: Build unsigned review artifact, NEVER publish or install
        run: python tools/build_marketplace.py --output heating_ai_v1_marketplace.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heating-ai-v1-native-review-only
          path: heating_ai_v1_marketplace.zip
          retention-days: 7
  native-ha-2026-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install actual HA 2026.11 dependency set in disposable runner
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Import and exercise native V1 SHADOW with synthetic inputs
        run: PYTHONPATH=tools python tools/test_native_v1_ha2026.py
