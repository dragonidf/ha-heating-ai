name: Publish Marketplace V1 carrier
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: v1-marketplace-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REVIEW_SHA }}
          persist-credentials: false
      - name: Gate exact green main and approved V1 manual-mode fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$REVIEW_SHA"
          test "$(gh api "repos/$GH_REPO/pulls/24" --jq .merged)" = true
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'manifest.json').read_text())
          nested=json.loads((root/'custom_components/heating_ai_legacy/manifest.json').read_text())
          assert manifest == nested and manifest['domain']=='heating_ai_legacy'
          assert manifest['version']=='1.0.0'
          legacy=json.loads((root/'apps/heating_ai/release.json').read_text())
          assert legacy['version']=='0.3.23'
          # The exact approved manual-mode patch. Not only a matching old
          # version number: release.json must match this new module content.
          assert legacy['module_hashes']['heating_climate.py']=='125ff6fedcdf92f46fa599c3a7713a49af5e38704c4f6817bafdb45263082f17'
          PY
      - name: Build the inert native integration ZIP and verify every V1 module
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_marketplace_package.py -v
          python tools/build_ui.py --check
          python tools/build_marketplace.py --output heating_ai_v1_marketplace.zip
      - name: Publish immutable v1.0.0 only after accepted green Tests
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Carrier release exists; never replace a published installation'
            exit 0
          fi
          sha256sum heating_ai_v1_marketplace.zip
          gh release create v1.0.0 heating_ai_v1_marketplace.zip --repo "$GH_REPO" \
            --target "$REVIEW_SHA" \
            --title 'Heating AI V1 Marketplace carrier v1.0.0 (AppDaemon 0.3.23)' \
            --notes 'This Marketplace install supplies exactly nine SHA256-verified V1 AppDaemon modules from PR #24, plus an inert native integration carrier. It does NOT activate or restart the controller, change yaml, data, model, KWS or electricity, nor issue thermostat/fan commands. The existing AppDaemon deployment continues unchanged until a separately approved one-time symlink handoff with rollback and verified absence of duplicate writers. Follow docs/marketplace-v1.md. Carrier version 1.0.0; embedded backend runtime version 0.3.23.'
