name: Manual session development snapshot
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'feature/manual-kws-energy-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: git archive --format=zip -o /tmp/heating-ai-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: manual-session-source
          path: /tmp/heating-ai-source.zip
          retention-days: 1
