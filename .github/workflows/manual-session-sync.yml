name: Manual energy candidate build (branch only)
on:
  push:
    branches: [feature/manual-kws-energy-session]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-kws-energy-session
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tools/build_ui.py
      - name: Commit generated candidate assets only
        run: |
          git add frontend/heating-panel.js apps/heating_ai/heating_ui_assets.py apps/heating_ai/release.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync generated manual-energy candidate assets'
            git push origin HEAD:feature/manual-kws-energy-session
          fi
      - run: make check test
